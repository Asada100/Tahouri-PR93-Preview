<script>
(function () {
if (typeof PuzzleScreen === "undefined" || typeof JigsawScreen === "undefined") return;
const originalShow = PuzzleScreen.show.bind(PuzzleScreen);
const originalHandleActivityReady = PuzzleScreen.handleActivityReady.bind(PuzzleScreen);
PuzzleScreen.show = function (state) { if (state && state.type === "jigsaw") return JigsawScreen.show(state); return originalShow(state); };
PuzzleScreen.handleActivityReady = function (payload) { if (payload && payload.result && payload.result.type === "jigsaw") return; return originalHandleActivityReady(payload); };
})();
</script>
